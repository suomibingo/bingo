<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo - QR & Lisäarvonta</title>
    <style>
        :root {
            --bg: #2c3e50;
            --white: #ffffff;
            --green: #27ae60;
            --blue: #2980b9;
            --red: #e74c3c;
            --yellow: #f1c40f;
            --purple: #8e44ad;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
        }

        #setup {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            max-width: 350px;
            margin-top: 50px;
        }

        .btn {
            border: none;
            padding: 15px 25px;
            margin: 10px auto;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            display: block;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-green { background: var(--green); color: white; }
        .btn-blue { background: var(--blue); color: white; }
        .btn-red { background: var(--red); color: white; }
        .btn-orange { background: #f39c12; color: white; }
        .btn-purple { background: var(--purple); color: white; }

        #game-area { display: none; text-align: center; width: 100%; max-width: 600px; }
        
        .board-info { font-size: 14px; color: #bdc3c7; margin-bottom: 10px; background: rgba(0,0,0,0.3); padding: 5px 15px; border-radius: 20px; display: inline-block; }

        .bingo-table {
            border-collapse: collapse;
            margin: 10px auto;
            background: white;
            color: #333;
            box-shadow: 0 0 30px rgba(0,0,0,0.4);
        }

        .bingo-table th { background: var(--yellow); padding: 10px; border: 2px solid #333; font-size: 22px; color: #2c3e50; }
        .bingo-table td { border: 2px solid #333; width: 60px; height: 60px; text-align: center; font-size: 24px; font-weight: bold; cursor: pointer; position: relative; }

        .marked::after {
            content: ""; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 50px; height: 50px;
            border: 5px solid var(--red); border-radius: 50%; pointer-events: none; box-sizing: border-box;
        }

        tr.row-complete td::before {
            content: ""; position: absolute; top: 50%; left: -2px; right: -2px;
            height: 8px; background: rgba(231, 76, 60, 0.6); z-index: 10; pointer-events: none;
        }

        .star-cell { color: var(--yellow); font-size: 40px !important; text-shadow: 1px 1px 2px #000; }
        .spacer-row { height: 15px; background: #bdc3c7; border: none; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 5000;
            justify-content: center; align-items: center; flex-direction: column;
        }

        .modal-content {
            background: white; color: #333; padding: 25px;
            border-radius: 20px; width: 85%; max-width: 380px; text-align: center;
        }

        .game-tag { font-size: 14px; color: #7f8c8d; margin: -8px 0 10px 0; }
        .game-tag b { color: var(--purple); letter-spacing: 2px; }
        .name-input { width: 100%; box-sizing: border-box; padding: 14px; font-size: 20px; text-align: center; border: 2px solid #bdc3c7; border-radius: 12px; }
        .name-input.err { border-color: var(--red); }
        .name-hint { font-size: 13px; color: #7f8c8d; margin: 6px 0 6px 0; }
        .name-hint.err { color: var(--red); font-weight: bold; }
        .raffle-badge { display: none; margin: 0 0 10px; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 13px; }
        .raffle-badge.pending { display: inline-block; background: #fff3cd; color: #856404; }
        .raffle-badge.ok { display: inline-block; background: #d4edda; color: #155724; }
        .raffle-badge.fail { display: inline-block; background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

    <!-- ALOITUS -->
    <div id="setup">
        <h1 style="color:#2c3e50; margin:0 0 20px 0;">BINGO</h1>
        <div id="game-tag" class="game-tag" style="display:none;">Peli: <b id="game-tag-code"></b></div>
        <div id="name-box" style="display:none; margin-bottom:6px;">
            <input id="player-name" class="name-input" maxlength="24" placeholder="Nimi tai nimimerkki" autocomplete="off" aria-label="Nimi">
            <div id="name-hint" class="name-hint">Nimi näkyy tarkistajalle ja on mukana lisäarvonnassa.</div>
        </div>
        <button class="btn btn-green" onclick="startGame('pieni')">Pieni (5x5)</button>
        <button class="btn btn-blue" onclick="startGame('iso')">Iso (3 x 15)</button>
    </div>

    <!-- PELIALUE -->
    <div id="game-area">
        <div class="board-info">Luotu: <span id="board-time"></span></div>
        <div id="raffle-badge" class="raffle-badge"></div>
        <table class="bingo-table" id="bingo-board"></table>
        <div style="margin-top: 20px; display: flex; flex-direction: column; align-items: center;">
            <button class="btn btn-red" style="width: 200px; padding: 10px; font-size: 14px;" onclick="openQuitModal()">Lopeta peli</button>
        </div>
    </div>

    <!-- LOPETUSVARMISTUS -->
    <div id="quit-modal" class="modal">
        <div class="modal-content">
            <h2 style="margin:0; color:var(--red);">Lopetetaanko?</h2>
            <p>Haluatko varmasti palata alkuun?</p>
            <div style="display:flex; gap:10px; justify-content: center; margin-top: 20px;">
                <button class="btn" style="background:#ccc; color:#333; margin:0; width: auto; padding: 10px 30px;" onclick="closeQuitModal()">Palaa</button>
                <button class="btn btn-red" style="margin:0; width: auto; padding: 10px 30px;" onclick="window.location.reload()">Lopeta</button>
            </div>
        </div>
    </div>

<script>
    // --- ARVONTA JA TARKISTAJA: PELIKOODI, NIMI JA KORTTI ---
    // Pelikoodi tulee pelaajien QR:n linkistä (…/bingo/?peli=ABC123).
    // Nimi ja kortti lähetetään ntfy.sh-viestipalveluun: pelinjohtaja arpoo nimistä lisäarvonnan
    // ja tarkistaja näkee pelaajat ja kortit. Paperilappupelaajat liittyvät lapun numerolla.
    const RELAY_BASE = 'https://ntfy.sh/';
    const TOPIC_PREFIX = 'suomibingo-';
    const GAME_CODE = (function () {
        const p = new URLSearchParams(location.search).get('peli');
        return (p && /^[A-Za-z0-9]{4,12}$/.test(p)) ? p.toUpperCase() : '';
    })();
    const MY_ID = 'p' + Math.random().toString(36).slice(2, 10);
    let playerName = '';
    let myJoin = 'none';   // 'none' | 'pending' | 'ok' | 'fail'
    let myMsg = '';

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    // Lähettää viestin peliin. Yrittää uudelleen, jos palvelu on kiireinen tai verkko katkeaa.
    async function relayPublish(text) {
        for (let attempt = 0; attempt < 8; attempt++) {
            try {
                const ctl = new AbortController();
                const t = setTimeout(() => ctl.abort(), 8000);
                const res = await fetch(RELAY_BASE + TOPIC_PREFIX + GAME_CODE.toLowerCase(), { method: 'POST', body: String(text), signal: ctl.signal });
                clearTimeout(t);
                if (res.ok) return true;
                if (res.status >= 400 && res.status < 500 && res.status !== 429) return false;   // pysyvä virhe
            } catch (e) { /* verkkovirhe -> uusi yritys */ }
            await sleep(4000 + Math.random() * 8000);
        }
        return false;
    }

    // Pieni ilmoitin ruudulla – ei nappia, pelaaja on mukana automaattisesti heti kun kortti on valittu.
    function renderBadge() {
        const el = document.getElementById('raffle-badge');
        if (!GAME_CODE) { el.className = 'raffle-badge'; return; }
        if (myJoin === 'pending') { el.className = 'raffle-badge pending'; el.textContent = 'Liitytään lisäarvontaan…'; }
        else if (myJoin === 'ok') { el.className = 'raffle-badge ok'; el.textContent = '✓ Mukana lisäarvonnassa'; }
        else if (myJoin === 'fail') { el.className = 'raffle-badge fail'; el.textContent = 'Ei yhteyttä – yritetään uudelleen…'; }
        else { el.className = 'raffle-badge'; }
    }

    // Yrittää liittyä taustalla ilman käyttäjän toimia. relayPublish yrittää jo itsessään ~8 kertaa;
    // jos sekin epäonnistuu (esim. verkko poikki hetken), koko liittyminen yritetään vielä uudelleen muutaman kerran.
    let joinRound = 0;
    async function joinMyGame() {
        if (!GAME_CODE || !myMsg) return;
        myJoin = 'pending'; renderBadge();
        const ok = await relayPublish(myMsg);
        myJoin = ok ? 'ok' : 'fail';
        renderBadge();
        if (!ok && joinRound < 20) {
            joinRound++;
            setTimeout(joinMyGame, 45000 + Math.random() * 15000);
        }
    }

    // Kortti tekstinä samassa muodossa kuin paperilapun QR: "B: 1, 2, …; I: …; N: 31, T, …"
    function cardString() {
        const cols = [[], [], [], [], []];
        document.querySelectorAll('#bingo-board tbody tr').forEach(tr => {
            if (tr.classList.contains('spacer-row')) return;
            tr.querySelectorAll('td').forEach((td, c) => cols[c].push(td.classList.contains('star-cell') ? 'T' : td.innerText.trim()));
        });
        return ['B', 'I', 'N', 'G', 'O'].map((L, c) => L + ': ' + cols[c].join(', ')).join('; ');
    }

    if (GAME_CODE) {
        document.getElementById('game-tag').style.display = 'block';
        document.getElementById('game-tag-code').innerText = GAME_CODE;
        document.getElementById('name-box').style.display = 'block';
    }

    // --- PELIN HALLINTA ---
    function startGame(type) {
        if (GAME_CODE) {
            const nameEl = document.getElementById('player-name'), hint = document.getElementById('name-hint');
            const name = nameEl.value.trim().replace(/\s+/g, ' ').slice(0, 24);
            if (name.length < 2) {
                nameEl.classList.add('err'); hint.classList.add('err');
                hint.innerText = 'Kirjoita nimi tai nimimerkki (vähintään 2 merkkiä).';
                nameEl.focus();
                return;
            }
            playerName = name;
        }
        document.getElementById('setup').style.display = 'none';
        document.getElementById('game-area').style.display = 'block';
        document.getElementById('board-time').innerText = new Date().toLocaleTimeString('fi-FI');

        createBoard(type);

        if (GAME_CODE) {   // nimi (lisäarvonta) ja kortti (tarkistaja) lähtevät peliin automaattisesti
            myMsg = JSON.stringify({ t: 'j', id: MY_ID, nm: playerName, k: type, c: cardString() });
            joinMyGame();
        }
    }

    function openQuitModal() { document.getElementById('quit-modal').style.display = 'flex'; }
    function closeQuitModal() { document.getElementById('quit-modal').style.display = 'none'; }

    // --- RUUDUKON LUONTI ---
    function createBoard(type) {
        const board = document.getElementById('bingo-board');
        board.innerHTML = "<thead><tr><th>B</th><th>I</th><th>N</th><th>G</th><th>O</th></tr></thead>";
        const tbody = document.createElement('tbody');
        const colData = [];
        for (let c = 0; c < 5; c++) {
            let start = (c * 15) + 1;
            colData.push(Array.from({length: 15}, (_, i) => start + i).sort(() => Math.random() - 0.5));
        }
        const rowsCount = (type === 'iso') ? 15 : 5;
        for (let r = 0; r < rowsCount; r++) {
            if (type === 'iso' && r > 0 && r % 5 === 0) {
                let sp = document.createElement('tr'); sp.className = 'spacer-row';
                for(let i=0; i<5; i++) sp.appendChild(document.createElement('td'));
                tbody.appendChild(sp);
            }
            let tr = document.createElement('tr');
            for (let c = 0; c < 5; c++) {
                const td = document.createElement('td');
                let isStar = (type==='pieni'&&r===2&&c===2) || (type==='iso'&&(r===2||r===7||r===12)&&c===2);
                if (isStar) { td.innerHTML = "★"; td.classList.add('star-cell', 'marked'); } 
                else { td.innerText = colData[c][r % 15]; }
                td.onclick = function() { 
                    if(this.innerText || this.innerHTML.includes("★")) {
                        this.classList.toggle('marked');
                        checkRow(this.parentElement);
                    }
                };
                tr.appendChild(td);
            }
            tbody.appendChild(tr);
            checkRow(tr);
        }
        board.appendChild(tbody);
    }

    function checkRow(row) {
        let cells = row.querySelectorAll('td');
        if (cells.length < 5) return;
        let full = true;
        cells.forEach(c => { if(!c.classList.contains('marked')) full = false; });
        if(full) row.classList.add('row-complete'); else row.classList.remove('row-complete');
    }

</script>
</body>
</html>
